{% extends "core/base.html" %}

{% block content %}
<h2>Delete Anomaly</h2>

<p>Are you sure you want to delete this anomaly?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'anomaly-detail' object.pk %}">Cancel</a>
</form>
{% endblock %}
