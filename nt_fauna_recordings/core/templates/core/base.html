<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NT Fauna Recordings{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
            color: #222;
        }

        header {
            background-color: #204b57;
            color: white;
            padding: 1rem 2rem;
        }

        header h1 {
            margin: 0;
            font-size: 1.6rem;
        }

        nav {
            margin-top: 0.8rem;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 1rem;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            width: 85%;
            max-width: 1000px;
            margin: 2rem auto;
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            background-color: #fafafa;
        }

        .btn {
            display: inline-block;
            background-color: #204b57;
            color: white;
            text-decoration: none;
            padding: 0.6rem 1rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .btn:hover {
            background-color: #163841;
        }

        .badge {
            display: inline-block;
            padding: 0.3rem 0.6rem;
            border-radius: 5px;
            background-color: #e8eef0;
            font-size: 0.9rem;
            margin-left: 0.3rem;
        }

        footer {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            padding: 1rem;
            margin-top: 2rem;
        }

        form p {
            margin-bottom: 1rem;
        }

        input, select, textarea {
            width: 100%;
            max-width: 100%;
            padding: 0.6rem;
            margin-top: 0.3rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 100px;
        }

        ul {
            padding-left: 1.2rem;
        }

        .meta {
            color: #666;
            font-size: 0.9rem;
        }

        .section-title {
            margin-top: 0;
            color: #204b57;
        }
    </style>
</head>
<body>
    <header>
        <h1>NT Fauna Recordings</h1>
        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'species-list' %}">Species</a>
            <a href="{% url 'observation-list' %}">Observations</a>
            <a href="{% url 'anomaly-list' %}">Anomalies</a>
            <a href="{% url 'anomaly-create' %}">Report Anomaly</a>
        </nav>
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>Listening to NT’s Disappearing Animals</p>
    </footer>
</body>
</html>
