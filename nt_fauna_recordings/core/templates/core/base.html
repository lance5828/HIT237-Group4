<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NT Fauna Recordings{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
            color: #222;
        }

        nav {
            background-color: #204b57;
            padding: 1rem 2rem;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 1rem;
            font-weight: bold;
        }

        .container {
            width: 85%;
            max-width: 1000px;
            margin: 2rem auto;
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            background-color: #fafafa;
        }

        .btn {
            display: inline-block;
            background-color: #204b57;
            color: white;
            text-decoration: none;
            padding: 0.6rem 1rem;
            border-radius: 6px;
        }

        .badge {
            display: inline-block;
            padding: 0.3rem 0.6rem;
            border-radius: 5px;
            background-color: #e8eef0;
            font-size: 0.9rem;
        }

        form p {
            margin-bottom: 1rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.6rem;
            margin-top: 0.3rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/">Home</a>
        <a href="/species/">Species</a>
        <a href="/observations/">Observations</a>
        <a href="/anomalies/">Anomalies</a>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
