{% extends 'base.html' %}
{% block title %}Signed out – NT Fauna Recordings{% endblock %}

{% block content %}

<div style="max-width: 380px; margin: 0 auto; text-align: center;">

  <div style="width: 52px; height: 52px; background: #e8eef0; border-radius: 50%;
              display: flex; align-items: center; justify-content: center;
              margin: 0 auto 1rem; color: #204b57;" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"

      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
      <polyline points="16 17 21 12 16 7"/>
      <line x1="21" y1="12" x2="9" y2="12"/>

  </div>

  <h2 style="color: #204b57; margin-bottom: 0.4rem;">You've been signed out</h2>

    Thanks for using NT Fauna Recordings.
  </p>

  <a href="{% url 'accounts:login' %}" class="btn"
     style="display: block; text-decoration: none; text-align: center;">
    ← Back to login
  </a>

</div>

{% endblock %}
